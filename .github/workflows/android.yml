name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: runtime-cache
        with:
          path: .cache/tdlib-runtime/${{ matrix.abi }}
          key: tdlib-42e6a525-openssl359-ndk28-${{ matrix.abi }}-${{ hashFiles('tools/build-tdlib-android.sh') }}
      - name: Seed cache from previously verified official build when retained
        id: seed
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 37160232765
          github-token: ${{ github.token }}
          name: tdlib-${{ matrix.abi }}
          path: .cache/tdlib-runtime
      - name: Check the retained build before caching it
        if: steps.seed.outcome == 'success'
        env:
          TD_ABI: ${{ matrix.abi }}
        run: |
          if [ "$TD_ABI" = arm64-v8a ]; then TD_EXPECTED=953ca2b1749c21eb6663db64a6a00ac8d59356e119a63848a316c43f7f9ab11e; else TD_EXPECTED=d7cabfaa696797948acbc4663c40085b408322917c2b56c6b7f5e581095bdf62; fi
          printf '%s  %s\n' "$TD_EXPECTED" ".cache/tdlib-runtime/$TD_ABI/libtdjsonjava.so" | sha256sum --check
          printf '%s  libtdjsonjava.so\n' "$TD_EXPECTED" > ".cache/tdlib-runtime/$TD_ABI/SHA256SUMS"
      - name: Rebuild pinned official sources when cache and retained artifact are unavailable
        if: steps.runtime-cache.outputs.cache-hit != 'true' && steps.seed.outcome != 'success'
        env:
          TD_ABI: ${{ matrix.abi }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gperf libssl-dev ninja-build
          sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"
          bash tools/build-tdlib-android.sh "$TD_ABI" .cache/tdlib-runtime
      - name: Verify the library and its 16 KB ELF alignment
        env:
          TD_ABI: ${{ matrix.abi }}
        run: |
          cd ".cache/tdlib-runtime/$TD_ABI"
          sha256sum --check SHA256SUMS
          readelf -lW libtdjsonjava.so | awk '/LOAD/ { if ($NF != "0x4000" && $NF != "0x10000") exit 1; found=1 } END { if (!found) exit 1 }'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tdlib-${{ matrix.abi }}
          path: .cache/tdlib-runtime/
          if-no-files-found: error
          retention-days: 30

  build:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"
      - name: Bundle verified official TDLib libraries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: tdlib-*
          path: app/src/main/jniLibs
          merge-multiple: true
      - name: Test, lint and assemble
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon --console=plain
      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hunmeng-console-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-reports
          path: app/build/reports/
          if-no-files-found: ignore
          retention-days: 30

  ui:
    needs: native
    permissions:
      contents: read
      actions: read
    if: github.ref == 'refs/heads/codex/v005-account-session'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Load verified official TDLib runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: tdlib-*
          path: app/src/main/jniLibs
          merge-multiple: true
      - uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            ./gradlew connectedDebugAndroidTest --no-daemon --console=plain
            mkdir -p ui-test-images/normal
            cp -R app/build/outputs/connected_android_test_additional_output/. ui-test-images/normal/
            adb shell settings put system font_scale 1.6
            ./gradlew connectedDebugAndroidTest --rerun-tasks --no-daemon --console=plain
            mkdir -p ui-test-images/large-font
            cp -R app/build/outputs/connected_android_test_additional_output/. ui-test-images/large-font/
            find ui-test-images -type f -name '*.png' -print | tee ui-test-images/files.txt
            test -s ui-test-images/files.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-device-checks
          path: |
            app/build/reports/androidTests/
            ui-test-images/
          if-no-files-found: ignore
